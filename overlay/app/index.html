<!-- Deep: the planet, drawn once. The ring passes behind it and back across
     the front; both halves are the same solid blue. -->
<svg width="0" height="0" style="position:absolute" aria-hidden="true">
  <defs>
    <clipPath id="ringfront" clipPathUnits="userSpaceOnUse"><rect x="-80" y="0" width="160" height="80" transform="rotate(-16)"/></clipPath>
    <symbol id="ringed" viewBox="-50 -50 100 100">
      <ellipse rx="46" ry="11" transform="rotate(-16)" fill="none" style="stroke:var(--ring,#7fa2ff);stroke-width:var(--rw,2.4)"/>
      <circle r="25" style="fill:var(--planet,#2f5fe0)"/>
      <ellipse rx="46" ry="11" transform="rotate(-16)" fill="none" clip-path="url(#ringfront)" style="stroke:var(--ring,#7fa2ff);stroke-width:var(--rw,2.4)"/>
    </symbol>
  </defs>
</svg>
<div id="win" class="win">

  <!-- Frameless window: our own drag strip and buttons. -->
  <div class="chrome" data-tauri-drag-region>
    <div class="chrome-btns">
      <button class="wbtn" id="min" aria-label="Minimize"><svg viewBox="0 0 12 12" width="12" height="12"><path d="M2 6h8" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/></svg></button>
      <button class="wbtn" id="max" aria-label="Full screen"><svg viewBox="0 0 12 12" width="12" height="12"><rect x="2.2" y="2.2" width="7.6" height="7.6" rx="1.6" fill="none" stroke="currentColor" stroke-width="1.5"/></svg></button>
      <button class="wbtn close" id="close" aria-label="Close"><svg viewBox="0 0 12 12" width="12" height="12"><path d="M3 3l6 6M9 3l-6 6" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/></svg></button>
    </div>
  </div>

       soft filled shapes: a mushy, doorless house, a clock face drawn like the app icon,
